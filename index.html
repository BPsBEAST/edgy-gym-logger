<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10111a"><title>EDGY Gym Logger</title><link rel="manifest" href="manifest.webmanifest"><style>

{background:#252638;color:#fff;border:1px solid #424359;border-radius:10px;padding:11px;width:100%;min-width:0}.pill{display:inline-block;border-radius:50px;background:#2b2d45;padding:5px 10px;color:#b5baff;font-size:12px}.sethead,.setrow{display:grid;grid-template-columns:40px 1fr 75px 65px 36px;gap:6px;align-items:center;text-align:center}.setrow{margin:8px 0}.setrow input{text-align:center;padding:10px 4px}.setrow .done{accent-color:#737cff;width:20px;height:20px}.filters{display:flex;overflow:auto;gap:7px;padding:8px 0}.filters button{white-space:nowrap}.progress{height:8px;background:#30324a;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:#7781ff}.item{padding:12px 0;border-bottom:1px solid #34364a}.item:last-child{border:0}.hidden{display:none}.chart{display:flex;height:130px;align-items:end;gap:9px;padding:10px 0}.bar{flex:1;background:#6879fb;border-radius:6px 6px 0 0;min-height:3px}.barslot{flex:1;text-align:center;display:flex;align-items:stretch;flex-direction:column;justify-content:end;height:100%;gap:5px}.barslot small{font-size:9px;color:#9b9eb2}#toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#33375d;padding:12px 16px;border-radius:10px;display:none;z-index:20;max-width:85%;text-align:center}@media(min-width:850px){.nav{left:50%;width:760px;transform:translateX(-50%)}}
